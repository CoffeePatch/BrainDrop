name: 🏷️ Inspect Tags & Taxonomy

on:
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  inspect:
    name: Scan & Inspect Raindrop Tag Taxonomy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inspect Tags & Render Step Summary
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          RULES_JSON: ${{ secrets.RULES_JSON }}
        run: |
          if [ -z "$RAINDROP_TOKEN" ]; then
            echo "::warning title=Missing Secrets::RAINDROP_TOKEN is not configured in repository secrets. Please add it under Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          npx tsx src/index.ts tags --dry-run
          npx tsx src/index.ts tags --export

      - name: Upload Tag Inventory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tags-inventory
          path: tags-inventory.md
          retention-days: 14
